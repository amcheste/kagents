{{- if .Values.trigger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-trigger
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kagents
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trigger
spec:
  replicas: {{ .Values.trigger.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kagents
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: trigger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagents
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: trigger
      {{- with .Values.trigger.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.trigger.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.trigger.podSecurityContext | nindent 8 }}
      containers:
        - name: trigger
          image: "{{ .Values.trigger.image.repository }}:{{ .Values.trigger.image.tag }}"
          imagePullPolicy: {{ .Values.trigger.image.pullPolicy }}
          args:
            - "--listen-address=:{{ .Values.trigger.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.trigger.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.trigger.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.trigger.containerSecurityContext | nindent 12 }}
      {{- with .Values.trigger.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trigger.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trigger.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
