{{- if .Values.trigger.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-trigger
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kagents
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trigger
spec:
  type: {{ .Values.trigger.service.type }}
  ports:
    - name: http
      port: {{ .Values.trigger.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kagents
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trigger
{{- end }}
