site_name: kagents
site_description: Run Claude Code Agent Teams as a Kubernetes operator
site_url: https://kagents.dev
site_author: Alan Chester

repo_name: amcheste/kagents
repo_url: https://github.com/amcheste/kagents
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Alan Chester

# Files inside docs/ that aren't part of the public site.
# `helm-values.md` and `cfp/` predate the docs site and link to repo
# files outside docs/; they'll be migrated into the site (helm-values
# under /reference/, cfp/ stays internal) in follow-up v0.7.0 issues.
# `README.md` collides with index.md on the auto-generated index — kept
# in-repo as the contributor-facing dev-loop guide.
exclude_docs: |
  README.md
  helm-values.md
  cfp/

theme:
  name: material
  # No logo: the personal alanchester-brand wordmark belongs on
  # alanchester.com, not on downstream-repo docs sites. The site_name
  # ("kagents") fills the left of the header on its own. The favicon
  # uses the monogram, which is shared family-brand identity.
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  # Palette names ("black", "white") are Material's named slots. The
  # actual colors come from docs/stylesheets/brand.css, which maps
  # Material's --md-* tokens onto the alanchester-brand --ac-* tokens.
  # We pick "black" + "white" rather than "indigo" so Material's
  # built-in CSS doesn't tint anything on the default theme path.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github

# The brand override stylesheets are applied after Material's own CSS
# so token mappings win at the cascade level. Order matters: tokens
# first (so brand.css can reference them via var()), then brand.css.
extra_css:
  - stylesheets/ac-colors.css
  - stylesheets/ac-typography.css
  - stylesheets/brand.css

# JS hook for the brand drawer pattern. Material's drawer is scoped to
# viewport <76.25em in both its CSS and its JS, so we drive the
# slide-out from a separate data-attribute hook above that breakpoint.
extra_javascript:
  - javascripts/drawer.js

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # pymdownx.emoji wired to Material's icon index resolves the
  # `:material-*:` shortcodes scattered through docs/index.md (and
  # any future page) into inline SVG icons. Without this, the
  # shortcodes render as literal `:material-protocol:` text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Mermaid diagrams. Material has built-in renderer support; this
        # routes ```mermaid fences through it.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amcheste/kagents

# Diátaxis nav: Tutorials (learn) / How-to (solve) / Reference (look up) /
# Explanation (understand). Section index pages exist as placeholders so
# the structure is in place even before all content lands.
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Getting started: tutorials/getting-started.md
  - How-to guides:
      - how-to/index.md
      - Install:
          - On Amazon EKS: how-to/install/eks.md
          - On Google GKE: how-to/install/gke.md
          - On Azure AKS: how-to/install/aks.md
      - Operate:
          - Expose the dashboard: how-to/operate/expose-dashboard.md
          - Configure shared storage: how-to/operate/shared-storage.md
          - Set budget alerts: how-to/operate/budget-alerts.md
      - Author skills:
          - Package and publish skills: how-to/skill-authoring.md
  - Reference:
      - reference/index.md
      - API reference: reference/api/index.md
  - Explanation:
      - explanation/index.md
      - Resource model: explanation/resources.md
      - Coordination protocol: explanation/coordination.md
      - Operations: explanation/operations.md
