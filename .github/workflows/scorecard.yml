name: OpenSSF Scorecard

# Thin caller stub: logic lives in amcheste/gh-workflows (includes the
# default-branch guard so pushes to non-default branches skip instead of
# failing). Dependabot bumps the pin as gh-workflows releases.

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'  # Every Monday at 01:30 UTC
  push:
    branches: [main, develop]
  workflow_dispatch:

# The reusable workflow's job requests security-events:write (SARIF upload)
# and id-token:write (scorecard OIDC signing); a called workflow can only
# downgrade the caller's grant, so they must be granted here or the run dies
# at startup ("workflow file issue").
permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: amcheste/gh-workflows/.github/workflows/reusable-scorecard.yml@v1.1.0
