name: SAST

# Thin caller stub: logic lives in amcheste/gh-workflows. Add language rule
# packs via the semgrep-config input (p/secrets is the universal floor).
# Dependabot bumps the pin as gh-workflows releases.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC

# The reusable workflow's job requests security-events:write (SARIF upload);
# a called workflow can only downgrade the caller's grant, so it must be
# granted here or the run dies at startup ("workflow file issue").
permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    uses: amcheste/gh-workflows/.github/workflows/reusable-sast.yml@v1.1.0
    with:
      semgrep-config: >-
        p/secrets
        p/bash
        p/go
        p/owasp-top-ten
